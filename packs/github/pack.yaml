# Agents that work a GitHub repo through issues and PRs: plan, dev and
# refinery pools, and the pr-work, ci-repair and stall-check workflows.
# Vars: see README.md. packs/selfdev is an instance of this pack.
defaults:
  ci_workflow: ci
  # Branch master-red watches. A drill workspace can point it at a
  # throwaway red branch (docs/verify/ci-repair-drill.md).
  ci_branch: master
  dev_sessions: 2
  # More than 1 needs branch protection that requires up-to-date checks
  # (strict), so a merge after another merge waits for CI on the new base.
  refinery_sessions: 1
  # Refinery model and effort (#304 pool options). Empty: the agent's.
  refinery_model: ""
  refinery_effort: ""
  # Implement routing by difficulty (JOB-59). pr-work's implement step
  # runs in the pool named by its dev_pool run var (default dev_pool
  # below); a failed attempt or a review resume moves it to dev. dev is
  # the strong model, dev-sonnet the cheaper one. Empty model or effort:
  # the agent's.
  dev_pool: dev
  dev_model: ""
  dev_effort: ""
  dev_sonnet_sessions: 1
  dev_sonnet_model: claude-sonnet-5-5
  dev_sonnet_effort: high
  # Stall pool model and effort. Empty: the agent's.
  stall_model: ""
  stall_effort: ""
  # post-merge steps wait on CI and deploy in their own pool (#167).
  deploy_sessions: 3
  # Refinery merge policy (prompts/merge.md, ci-merge.md).
  merge_method: squash
  # Run by dev before pushing and by the refinery on the PR head.
  check_cmd: "true"
  required_approver: ""
  required_checks: ""
  guide: >-
    Read the repo's README and contributor docs (AGENTS.md,
    CONTRIBUTING.md) first.
  # Stall thresholds (#143).
  stall_after: 1h
  stall_step_after: 3h
  stall_human_after: 4h
  # GitHub logins besides {{.human}} whose issues start work (#340).
  # Comma-separated. Others need the accepted label.
  authors: ""
  # pr_unmerged skips PRs by {{.human}}, by these logins, or with one of
  # these labels (#509): operator PRs kept open on purpose. Comma-separated.
  stall_pr_skip_authors: ""
  stall_pr_skip_labels: hold
  # Label release-please puts on its open release PR (#698). The
  # release-pr trigger routes a green one to the refinery, and
  # pr_unmerged skips it. Empty turns the trigger off.
  release_pr_label: "autorelease: pending"
  deploy_check: >-
    none (these agents do not deploy this repo); treat this check as
    passed.
  # Where pr-work issues live (#232): github, or linear with the
  # linear_* vars below. Prompts come from prompts/<tracker>/.
  tracker: github
  linear_workspace: ""
  # Team key (ENG) this instance works; one instance (with a prefix)
  # per Linear team and repo.
  linear_team: ""
  # Linear issue the planner reads as its target (ENG-1).
  linear_target: ""
  # State post-merge moves a shipped issue to.
  linear_done_state: Done
  # Labels that keep a Linear issue out of intake (`jobshop linear
  # eligible --skip-labels`, #279). Comma-separated. Blocked is set while
  # a worker question waits on the issue (#293). target and proposed are
  # planner parents whose sub-issues are the work (JOB-4): never a run.
  # tracking marks an issue that stays open and never gets a run (JOB-9).
  # Set any of them with `jobshop linear label <KEY> add <label>`.
  linear_skip_labels: Blocked,target,proposed,tracking
  # Linear user (name, display name or email) mentioned by questions and
  # escalations posted on a run's Linear issue (#293). Empty: no mention.
  linear_human: ""
  # Intake (#287): open issues of linear_team in these states (and with
  # one of these labels, if set) and no open run start pr-work through
  # stall-check. Comma-separated; empty labels match any.
  linear_intake_states: Todo
  linear_intake_labels: ""
  # Planner list filter by assignee (#292): a name, `me`, or empty for any.
  linear_intake_assignee: ""
  linear_poll: 5m
  # Parallel PRs that append numbered sections to one doc take the same
  # number and conflict (#131).
  docs_rule: >-
    put a design note or runbook check in a new file of its own, named by
    the issue number. Never append a numbered section to a shared doc.
  # Chat pool (type: chat, e.g. the operator pack's operator) where the
  # controller opens one escalation chat per escalation ticket (#379).
  # Empty: escalation tickets only, no chat.
  escalation_chat_pool: ""
  # The planner proposes the next target (label proposed) when work runs
  # out; a human approves by relabeling it target (#488). false: only
  # humans file targets.
  propose_targets: true
pools:
  dev:
    agent: "{{.agent}}"
    repo: "{{.checkout}}"
    ref: origin/master
    max_sessions: "{{.dev_sessions}}"
    model: "{{.dev_model}}"
    effort: "{{.dev_effort}}"
    idle_timeout: 10m
    turn_timeout: 2h
    prompt_file: prompts/{{.tracker}}/dev.md
  # Easier implement steps (JOB-59): same prompt, cheaper model.
  dev-sonnet:
    agent: "{{.agent}}"
    repo: "{{.checkout}}"
    ref: origin/master
    max_sessions: "{{.dev_sonnet_sessions}}"
    model: "{{.dev_sonnet_model}}"
    effort: "{{.dev_sonnet_effort}}"
    idle_timeout: 10m
    turn_timeout: 2h
    prompt_file: prompts/{{.tracker}}/dev.md
  plan:
    agent: "{{.agent}}"
    repo: "{{.checkout}}"
    ref: origin/master
    max_sessions: 1
    idle_timeout: 10m
    turn_timeout: 2h
    prompt_file: prompts/{{.tracker}}/plan.md
    admin: [session-list, session-restart, trigger-list, report-incidents, attention, activity, handoff]
  # stall-check steps run here and inspect or restart sessions. Separate
  # from plan so they can use a cheaper model and do not queue behind it.
  stall:
    agent: "{{.agent}}"
    repo: "{{.checkout}}"
    ref: origin/master
    max_sessions: 1
    model: "{{.stall_model}}"
    effort: "{{.stall_effort}}"
    idle_timeout: 10m
    turn_timeout: 2h
    admin: [session-list, session-restart, trigger-list, report-incidents, attention, activity, handoff]
  refinery:
    agent: "{{.agent}}"
    repo: "{{.checkout}}"
    ref: origin/master
    max_sessions: "{{.refinery_sessions}}"
    model: "{{.refinery_model}}"
    effort: "{{.refinery_effort}}"
    idle_timeout: 10m
    turn_timeout: 2h
    prompt_file: prompts/refinery.md
  # post-merge steps sleep here until the deploy lands (up to an hour),
  # so the single refinery session stays free for review-merge (#167).
  deploy-check:
    agent: "{{.agent}}"
    repo: "{{.checkout}}"
    ref: origin/master
    max_sessions: "{{.deploy_sessions}}"
    idle_timeout: 10m
    turn_timeout: 2h
    prompt_file: prompts/deploy-check.md
triggers:
  replan:
    when:
      pool: dev
      ready_below: 1
    ticket:
      pool: plan
      title: Plan next step
      priority: 1
      labels: [plan]
    cooldown: 10m
  # One ci-repair run per failing master SHA. A failed CI run on the
  # branch fires it at once (JOB-62, needs the repo's webhook to reach
  # ingest); the check, every fallback, covers a lost webhook. Both dedup
  # on the SHA. gh needs GH_TOKEN in the controller environment.
  master-red:
    on:
      - github: {event: workflow_run, action: completed, repo: "{{.repo}}", workflow: "{{.ci_workflow}}", branch: "{{.ci_branch}}", conclusion: failure}
    fallback: 5m
    when:
      check: >-
        gh run list --repo {{.repo}} --branch {{.ci_branch}} --workflow {{.ci_workflow}}
        --status completed --limit 1 --json conclusion,headSha
        --jq '.[] | select(.conclusion == "failure") | .headSha' | grep .
      check_timeout: 30s
    run:
      workflow: ci-repair
      vars: {sha: "{{.check_output}}"}
      key: "{{.check_output}}"
  # One release-merge run per green release-please PR (#698): those PRs
  # have no pr-work run, so nothing else merges them. The check prints
  # the lowest such PR number; the key dedups it. The run's open ticket
  # holds the trigger, so a second release PR waits for the first. A
  # completed check suite fires the check at once (JOB-62).
  release-pr:
    on:
      - github: {event: check_suite, action: completed, repo: "{{.repo}}"}
    fallback: 5m
    when:
      check: >-
        test -n "{{.release_pr_label}}" &&
        gh pr list --repo {{.repo}} --state open --label "{{.release_pr_label}}"
        --json number,isDraft,statusCheckRollup --jq '
        [.[]
        | select(.isDraft | not)
        | select((.statusCheckRollup | length) > 0 and all(.statusCheckRollup[];
        .conclusion == "SUCCESS" or .conclusion == "SKIPPED" or .conclusion == "NEUTRAL"))
        | .number] | sort | .[0] // empty' | grep .
      check_timeout: 30s
    run:
      workflow: release-merge
      vars: {pr: "{{.check_output}}"}
      key: "release-pr-{{.check_output}}"
  # Work that stopped moving (#143). Store signals are computed by the
  # controller; the others are gh checks, one subject per output line.
  stall:
    when:
      check_timeout: 1m
      stall:
        - {signal: ready_unclaimed, after: "{{.stall_after}}"}
        - {signal: pool_quarantined}
        - {signal: step_stalled, after: "{{.stall_step_after}}"}
        - {signal: session_silent, after: "{{.stall_after}}"}
        - {signal: needs_human, after: "{{.stall_human_after}}"}
        - {signal: blocked, after: "{{.stall_after}}"}
        # Open issues older than 30m that are not targets, decisions,
        # escalations, tracking or drills, filed by an App (the planner),
        # {{.human}} or a login in {{.authors}}, or labeled accepted (#340);
        # the controller drops those with an open run.
        - signal: issue_no_run
          repo: "{{.repo}}"
          check: >-
            gh issue list --repo {{.repo}} --state open --limit 200
            --json number,labels,title,createdAt,author --jq '
            ("{{.human}},{{.authors}}" | ascii_downcase | split(",") | map(select(. != ""))) as $ok
            | .[]
            | select(.author.is_bot or ([.author.login | ascii_downcase] | inside($ok))
            or ([.labels[].name] | any(. == "accepted")))
            | select([.labels[].name] | any(. == "target" or . == "needs-decision"
            or . == "needs-human" or . == "tracking" or . == "proposed") | not)
            | select(.title | test("^drill"; "i") | not)
            | select((now - (.createdAt | fromdateiso8601)) > 1800)
            | "\(.number) open, no run"'
        # Linear issues ready for work with no run (#287). Off while
        # linear_team is empty.
        - signal: linear_issue_no_run
          team: "{{.linear_team}}"
          states: "{{.linear_intake_states}}"
          labels: "{{.linear_intake_labels}}"
          skip_labels: "{{.linear_skip_labels}}"
          poll: "{{.linear_poll}}"
        # No commit on {{.ci_branch}} for 6h while PRs are open. The subject
        # is the last commit, so each dry spell is one stall.
        - signal: no_merge
          check: >-
            test "$(gh pr list --repo {{.repo}} --state open --json number --jq length)" -gt 0 &&
            gh api repos/{{.repo}}/commits/{{.ci_branch}} --jq
            'select((now - (.commit.committer.date | fromdateiso8601)) > 21600)
            | "\(.sha[0:12]) last commit \(.commit.committer.date)"'
    run:
      workflow: stall-check
      vars: {signal: "{{.stall_signal}}", subject: "{{.stall_subject}}", detail: "{{.stall_detail}}"}
    cooldown: 30m
    max_runs: 2
  # Non-draft PRs with all checks green, untouched for 2h, get a
  # pr-review run keyed pr-<n> (JOB-33): hand-opened PRs, orphans, and
  # PRs another instance's run opened in this repo. A pr-review started
  # by hand or by that run under the same key is returned, not doubled.
  # PRs by {{.human}} or stall_pr_skip_authors, or with a
  # stall_pr_skip_labels label, are held on purpose (#509).
  pr-unmerged:
    when:
      check_timeout: 1m
      stall:
        - signal: pr_unmerged
          check: >-
            gh pr list --repo {{.repo}} --state open
            --json number,isDraft,updatedAt,statusCheckRollup,author,labels --jq '
            ("{{.human}},{{.stall_pr_skip_authors}}" | ascii_downcase | split(",") | map(select(. != ""))) as $skipa
            | ("{{.stall_pr_skip_labels}}" | ascii_downcase | split(",") | map(select(. != ""))) as $skipl
            | .[]
            | select(.isDraft | not)
            | select(.author.login | ascii_downcase | IN($skipa[]) | not)
            | select(any(.labels[].name | ascii_downcase; IN($skipl[])) | not)
            | select(("{{.release_pr_label}}" | ascii_downcase) as $rl
            | $rl == "" or (any(.labels[].name | ascii_downcase; . == $rl) | not))
            | select((.statusCheckRollup | length) > 0 and all(.statusCheckRollup[];
            .conclusion == "SUCCESS" or .conclusion == "SKIPPED" or .conclusion == "NEUTRAL"))
            | select((now - (.updatedAt | fromdateiso8601)) > 7200)
            | "\(.number) green, unmerged since \(.updatedAt)"'
    run:
      workflow: pr-review
      vars: {pr: "{{.stall_subject}}"}
      key: "pr-{{.stall_subject}}"
    cooldown: 30m
    max_runs: 2
# Workers check what earlier sessions learned before retrying blind or
# reaching a human (#265).
prompt_rules:
  - name: recall
    at: system
    file: prompts/rules/recall.md
  # Escalation policy (#379): a human is reached only when one is needed.
  - name: escalate-policy
    at: system
    file: prompts/rules/escalate-policy.md
  # Nudge (#271): every pool, after the pool prompt, so it sits with the
  # step's close instructions. Chat sessions get it on their first turn
  # too: operator improvement sessions close runs and hit corrections.
  - name: learn-nudge
    at: after
    file: prompts/rules/learn-nudge.md
  # Implement routing rubric (JOB-59) where runs are started: the
  # planner and stall-check (plan) and task intake (dev).
  - name: dev-pool
    at: system
    match: {pools: [plan, dev, dev-sonnet]}
    file: prompts/rules/dev-pool.md
workflows:
  # One run per issue: implement (dev) -> review-merge (refinery) ->
  # post-merge (deploy-check). Started by the planner with --key issue-<n>.
  pr-work:
    vars: [issue, dev_pool]
    issue: issue
    repo: "{{.repo}}"
    tracker: "{{.tracker}}"
    # Only with tracker linear: a github instance may set
    # linear_workspace for pr-work-linear (#652).
    linear_workspace: '{{if eq .tracker "linear"}}{{.linear_workspace}}{{end}}'
    escalate_pool: plan
    escalate:
      chat_pool: "{{.escalation_chat_pool}}"
      prompt_file: prompts/escalation.md
      pool_prompt_file: prompts/escalation-pool.md
      hold_prompt_file: prompts/escalation-hold.md
    steps:
      - id: implement
        pool: "{{.dev_pool}}"
        retry_pool: dev
        retries: 3
        title: "Implement #{{.issue}}"
        prompt_file: prompts/{{.tracker}}/implement.md
      # Only when implement opened a PR (JOB-10); `--outcome done`
      # (work with no PR) skips this and post-merge.
      - id: review-merge
        pool: refinery
        retries: 2
        when: {step: implement, outcome: pr}
        title: "Review and merge PR for #{{.issue}}"
        prompt_file: prompts/{{.tracker}}/merge.md
      - id: post-merge
        pool: deploy-check
        retries: 2
        when: {step: implement, outcome: pr}
        title: "Check master CI and deploy for #{{.issue}}"
        prompt_file: prompts/{{.tracker}}/post-merge.md
  # pr-work for a Linear issue on an instance whose tracker is github
  # (#652): GitHub issues and Linear team linear_team in one instance.
  # Same steps and pools; the Linear prompts. Unused while linear_team is
  # empty. On a tracker: linear instance pr-work is already this.
  pr-work-linear:
    vars: [issue, dev_pool]
    issue: issue
    repo: "{{.repo}}"
    tracker: linear
    linear_workspace: "{{.linear_workspace}}"
    escalate_pool: plan
    escalate:
      chat_pool: "{{.escalation_chat_pool}}"
      prompt_file: prompts/escalation.md
      pool_prompt_file: prompts/escalation-pool.md
      hold_prompt_file: prompts/escalation-hold.md
    steps:
      - id: implement
        pool: "{{.dev_pool}}"
        retry_pool: dev
        retries: 3
        title: "Implement {{.issue}}"
        prompt_file: prompts/linear/implement.md
      # Only when implement opened a PR (JOB-10); `--outcome done`
      # (work with no PR) skips this and post-merge.
      - id: review-merge
        pool: refinery
        retries: 2
        when: {step: implement, outcome: pr}
        title: "Review and merge PR for {{.issue}}"
        prompt_file: prompts/linear/merge.md
      - id: post-merge
        pool: deploy-check
        retries: 2
        when: {step: implement, outcome: pr}
        title: "Check master CI and deploy for {{.issue}}"
        prompt_file: prompts/linear/post-merge.md
  # One run per PR that no pr-work run of this instance owns (JOB-33):
  # a PR another instance's implement step opened in this repo, or one
  # pr-unmerged found. Key pr-<n>. Same review and post-merge as
  # pr-work, reading the PR and its linked issue.
  pr-review:
    vars: [pr]
    pr: pr
    repo: "{{.repo}}"
    escalate_pool: plan
    escalate:
      chat_pool: "{{.escalation_chat_pool}}"
      prompt_file: prompts/escalation.md
      pool_prompt_file: prompts/escalation-pool.md
      hold_prompt_file: prompts/escalation-hold.md
    steps:
      - id: review-merge
        pool: refinery
        retries: 2
        title: "Review and merge PR #{{.pr}}"
        prompt_file: prompts/pr-review/merge.md
      - id: post-merge
        pool: deploy-check
        retries: 2
        # Only after a merge; held or closed PRs end the run here.
        when: {step: review-merge, outcome: merged}
        title: "Check master CI and deploy for PR #{{.pr}}"
        prompt_file: prompts/pr-review/post-merge.md
  # One run per stall, started by the stall trigger with key
  # stall:<signal>:<subject>. One attempt: a stall it cannot fix
  # escalates at once.
  stall-check:
    vars: [signal, subject, detail]
    escalate_pool: plan
    escalate:
      chat_pool: "{{.escalation_chat_pool}}"
      prompt_file: prompts/escalation.md
      pool_prompt_file: prompts/escalation-pool.md
      hold_prompt_file: prompts/escalation-hold.md
    steps:
      - id: diagnose
        pool: stall
        retries: 1
        title: "Stall {{.signal}}: {{.subject}}"
        prompt_file: prompts/stall.md
  # One run per failing master SHA, started by the master-red trigger with
  # the SHA as key: at most 2 fix attempts per SHA, then needs_human.
  ci-repair:
    vars: [sha]
    repo: "{{.repo}}"
    escalate_pool: plan
    escalate:
      chat_pool: "{{.escalation_chat_pool}}"
      prompt_file: prompts/escalation.md
      pool_prompt_file: prompts/escalation-pool.md
      hold_prompt_file: prompts/escalation-hold.md
    steps:
      - id: fix
        pool: dev
        retries: 2
        title: "Fix red master CI at {{.sha}}"
        prompt_file: prompts/ci-fix.md
      - id: merge
        pool: refinery
        retries: 2
        title: "Merge CI fix for {{.sha}}"
        prompt_file: prompts/ci-merge.md
  # One run per green release-please PR, started by the release-pr
  # trigger with key release-pr-<n> (#698). No review: release PRs are
  # merged by policy (#569, 2026-11-05 #644/#646).
  release-merge:
    vars: [pr]
    pr: pr
    repo: "{{.repo}}"
    escalate_pool: plan
    escalate:
      chat_pool: "{{.escalation_chat_pool}}"
      prompt_file: prompts/escalation.md
      pool_prompt_file: prompts/escalation-pool.md
      hold_prompt_file: prompts/escalation-hold.md
    steps:
      - id: merge
        pool: refinery
        retries: 2
        title: "Merge release PR #{{.pr}}"
        prompt_file: prompts/release-merge.md
  # Escalation drill (docs/verify/escalation-drill.md). One attempt
  # that always closes failed, so the run reaches needs_human at once.
  # Started by hand with --key drill-<date>.
  drill:
    vars: [issue]
    issue: issue
    repo: "{{.repo}}"
    escalate_pool: plan
    escalate:
      chat_pool: "{{.escalation_chat_pool}}"
      prompt_file: prompts/escalation.md
      pool_prompt_file: prompts/escalation-pool.md
      hold_prompt_file: prompts/escalation-hold.md
    steps:
      - id: fail
        pool: dev
        retries: 1
        title: "Escalation drill for #{{.issue}}"
        prompt_file: prompts/drill.md
