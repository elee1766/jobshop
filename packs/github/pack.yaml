# Agents that work a GitHub repo through issues and PRs: plan, dev and
# refinery pools, and the pr-work, ci-repair and stall-check workflows.
# Vars: see README.md. packs/selfdev is an instance of this pack.
defaults:
  ci_workflow: ci
  # Branch master-red watches. A drill workspace can point it at a
  # throwaway red branch (docs/verify/ci-repair-drill.md).
  ci_branch: master
  dev_sessions: 2
  # More than 1 needs branch protection that requires up-to-date checks
  # (strict), so a merge after another merge waits for CI on the new base.
  refinery_sessions: 1
  # post-merge steps wait on CI and deploy in their own pool (#167).
  deploy_sessions: 3
  # Refinery merge policy (prompts/merge.md, ci-merge.md).
  merge_method: squash
  # Run by dev before pushing and by the refinery on the PR head.
  check_cmd: "true"
  required_approver: ""
  required_checks: ""
  guide: >-
    Read the repo's README and contributor docs (AGENTS.md,
    CONTRIBUTING.md) first.
  # Stall thresholds (#143).
  stall_after: 1h
  stall_step_after: 3h
  stall_human_after: 4h
  deploy_check: >-
    none (these agents do not deploy this repo); treat this check as
    passed.
  # Where pr-work issues live (#232): github, or linear with the
  # linear_* vars below. Prompts come from prompts/<tracker>/.
  tracker: github
  linear_workspace: ""
  # Team key (ENG) this instance works; one instance (with a prefix)
  # per Linear team and repo.
  linear_team: ""
  # Linear issue the planner reads as its target (ENG-1).
  linear_target: ""
  # State post-merge moves a shipped issue to.
  linear_done_state: Done
  # Labels that keep a Linear issue out of intake (`jobshop linear
  # eligible --skip-labels`, #279). Comma-separated.
  linear_skip_labels: ""
  # Parallel PRs that append numbered sections to one doc take the same
  # number and conflict (#131).
  docs_rule: >-
    put a design note or runbook check in a new file of its own, named by
    the issue number. Never append a numbered section to a shared doc.
pools:
  dev:
    agent: ${agent}
    repo: ${checkout}
    ref: origin/master
    max_sessions: ${dev_sessions}
    idle_timeout: 10m
    turn_timeout: 2h
    prompt_file: prompts/${tracker}/dev.md
  plan:
    agent: ${agent}
    repo: ${checkout}
    ref: origin/master
    max_sessions: 1
    idle_timeout: 10m
    turn_timeout: 2h
    prompt_file: prompts/${tracker}/plan.md
    # stall-check steps run here and inspect or restart sessions.
    admin: [session-list, session-restart, trigger-list, report-incidents, attention, activity]
  refinery:
    agent: ${agent}
    repo: ${checkout}
    ref: origin/master
    max_sessions: ${refinery_sessions}
    idle_timeout: 10m
    turn_timeout: 2h
    prompt_file: prompts/refinery.md
  # post-merge steps sleep here until the deploy lands (up to an hour),
  # so the single refinery session stays free for review-merge (#167).
  deploy-check:
    agent: ${agent}
    repo: ${checkout}
    ref: origin/master
    max_sessions: ${deploy_sessions}
    idle_timeout: 10m
    turn_timeout: 2h
    prompt_file: prompts/deploy-check.md
triggers:
  replan:
    when:
      pool: dev
      ready_below: 1
    ticket:
      pool: plan
      title: Plan next step
      priority: 1
      labels: [plan]
    cooldown: 10m
  # One ci-repair run per failing master SHA. The check runs on every tick
  # while no master-red run is open; gh needs GH_TOKEN in the controller
  # environment.
  master-red:
    when:
      check: >-
        gh run list --repo ${repo} --branch ${ci_branch} --workflow ${ci_workflow}
        --status completed --limit 1 --json conclusion,headSha
        --jq '.[] | select(.conclusion == "failure") | .headSha' | grep .
      check_timeout: 30s
    run:
      workflow: ci-repair
      vars: {sha: "${check_output}"}
      key: "${check_output}"
  # Work that stopped moving (#143). Store signals are computed by the
  # controller; the others are gh checks, one subject per output line.
  stall:
    when:
      check_timeout: 1m
      stall:
        - {signal: ready_unclaimed, after: "${stall_after}"}
        - {signal: pool_quarantined}
        - {signal: step_stalled, after: "${stall_step_after}"}
        - {signal: session_silent, after: "${stall_after}"}
        - {signal: needs_human, after: "${stall_human_after}"}
        - {signal: blocked, after: "${stall_after}"}
        # Open issues older than 30m that are not targets, decisions,
        # escalations, tracking or drills; the controller drops those
        # with an open run.
        - signal: issue_no_run
          repo: ${repo}
          check: >-
            gh issue list --repo ${repo} --state open --limit 200
            --json number,labels,title,createdAt --jq '.[]
            | select([.labels[].name] | any(. == "target" or . == "needs-decision"
            or . == "needs-human" or . == "tracking") | not)
            | select(.title | test("^drill"; "i") | not)
            | select((now - (.createdAt | fromdateiso8601)) > 1800)
            | "\(.number) open, no run"'
        # Non-draft PRs with all checks green, untouched for 2h.
        - signal: pr_unmerged
          check: >-
            gh pr list --repo ${repo} --state open
            --json number,isDraft,updatedAt,statusCheckRollup --jq '.[]
            | select(.isDraft | not)
            | select((.statusCheckRollup | length) > 0 and all(.statusCheckRollup[];
            .conclusion == "SUCCESS" or .conclusion == "SKIPPED" or .conclusion == "NEUTRAL"))
            | select((now - (.updatedAt | fromdateiso8601)) > 7200)
            | "\(.number) green, unmerged since \(.updatedAt)"'
        # No commit on ${ci_branch} for 6h while PRs are open. The subject
        # is the last commit, so each dry spell is one stall.
        - signal: no_merge
          check: >-
            test "$(gh pr list --repo ${repo} --state open --json number --jq length)" -gt 0 &&
            gh api repos/${repo}/commits/${ci_branch} --jq
            'select((now - (.commit.committer.date | fromdateiso8601)) > 21600)
            | "\(.sha[0:12]) last commit \(.commit.committer.date)"'
    run:
      workflow: stall-check
      vars: {signal: "${stall_signal}", subject: "${stall_subject}", detail: "${stall_detail}"}
    cooldown: 30m
    max_runs: 2
# Workers check what earlier sessions learned before retrying blind or
# reaching a human (#265).
prompt_rules:
  - name: recall
    at: system
    text: >-
      When a command, test, CI run or step fails, and before asking a
      human (jobshop report waiting), run `jobshop recall <words from the
      error or question>` to search earlier ticket comments, session
      journals and learnings for the same problem and its fix.
  # Nudge (#271): every pool, after the pool prompt, so it sits with the
  # step's close instructions. Chat sessions get it on their first turn
  # too: operator improvement sessions close runs and hit corrections.
  - name: learn-nudge
    at: after
    text: >-
      Before `jobshop close` or `jobshop release`: if this turn hit a
      correction (a human or reviewer told you to do it differently), a
      failure, or a workaround, record it with `jobshop learn
      correction|failure|workaround "<summary>" --fix "<what to do next
      time>"`. Do not record a learning for routine success.
workflows:
  # One run per issue: implement (dev) -> review-merge (refinery) ->
  # post-merge (deploy-check). Started by the planner with --key issue-<n>.
  pr-work:
    vars: [issue]
    issue: issue
    repo: ${repo}
    tracker: ${tracker}
    linear_workspace: ${linear_workspace}
    escalate_pool: plan
    steps:
      - id: implement
        pool: dev
        retries: 3
        title: "Implement #${issue}"
        prompt_file: prompts/${tracker}/implement.md
      - id: review-merge
        pool: refinery
        retries: 2
        title: "Review and merge PR for #${issue}"
        prompt_file: prompts/${tracker}/merge.md
      - id: post-merge
        pool: deploy-check
        retries: 2
        title: "Check master CI and deploy for #${issue}"
        prompt_file: prompts/${tracker}/post-merge.md
  # One run per stall, started by the stall trigger with key
  # stall:<signal>:<subject>. One attempt: a stall it cannot fix
  # escalates at once.
  stall-check:
    vars: [signal, subject, detail]
    escalate_pool: plan
    steps:
      - id: diagnose
        pool: plan
        retries: 1
        title: "Stall ${signal}: ${subject}"
        prompt_file: prompts/stall.md
  # One run per failing master SHA, started by the master-red trigger with
  # the SHA as key: at most 2 fix attempts per SHA, then needs_human.
  ci-repair:
    vars: [sha]
    escalate_pool: plan
    steps:
      - id: fix
        pool: dev
        retries: 2
        title: "Fix red master CI at ${sha}"
        prompt_file: prompts/ci-fix.md
      - id: merge
        pool: refinery
        retries: 2
        title: "Merge CI fix for ${sha}"
        prompt_file: prompts/ci-merge.md
  # Escalation drill (docs/verify/escalation-drill.md). One attempt
  # that always closes failed, so the run reaches needs_human at once.
  # Started by hand with --key drill-<date>.
  drill:
    vars: [issue]
    issue: issue
    repo: ${repo}
    escalate_pool: plan
    steps:
      - id: fail
        pool: dev
        retries: 1
        title: "Escalation drill for #${issue}"
        prompt_file: prompts/drill.md
