# Self-development pack: agents that build Jobshop itself. An instance of
# packs/github with Jobshop's values. Vars: repo (checkout path), agent,
# dev_sessions. See README.md.
defaults:
  dev_sessions: 2
extends:
  - path: ../github
    vars:
      repo: elee1766/jobshop
      checkout: ${repo}
      agent: ${agent}
      dev_sessions: ${dev_sessions}
      human: elee1766
      ci_workflow: ci
      check_cmd: go build ./... && go vet ./... && go test ./...
      guide: >-
        Jobshop is Go, module github.com/elee1766/jobshop. Read AGENTS.md
        and docs/ first (docs/plan.md is the plan and decision log).
      # Self-deploy promotes the newest green master commit every 10
      # minutes, so a merged change is live once jobshop reports it.
      deploy_check: >-
        `jobshop version` prints `jobshop <version> (<commit>)`; the
        commit must be the merge commit (or the needed SHA) or a
        descendant: `git fetch origin && git merge-base --is-ancestor
        <sha> <commit>`. Self-deploy rebuilds with the newest green master
        commit every 10 minutes.
