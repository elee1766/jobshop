# Self-development pack: agents that build Jobshop itself. An instance of
# packs/github with Jobshop's values. Vars: repo (checkout path), agent,
# dev_sessions. See README.md.
defaults:
  dev_sessions: 2
  refinery_sessions: 1
  refinery_model: ""
  refinery_effort: ""
  # Implement routing (JOB-59, packs/github): dev runs the strong model,
  # dev-sonnet the cheaper one.
  dev_model: ""
  dev_effort: ""
  dev_sonnet_sessions: 1
  dev_sonnet_model: claude-sonnet-5-5
  dev_sonnet_effort: high
  stall_model: ""
  stall_effort: ""
  # Local memory (#592): relative to the root dir, so <root>/memory.
  memory_dir: memory
  memory_cap: 2200
  # Curator (#273): start a curate pass once this many open learnings
  # were recorded since the last pass, or daily when at least one was.
  curate_min_learnings: 10
  curate_every: 24h
  # Learning scopes the curate trigger counts (#524): this repo and its
  # pools, so another instance's learnings do not start this curator.
  # A YAML list of globs.
  curate_scope: ["repo:elee1766/jobshop", "pool:dev", "pool:dev-sonnet", "pool:plan", "pool:refinery", "pool:stall", "pool:deploy-check", "pool:learn"]
  # Curator gate (#274): evaluate a merged curator edit after this many
  # runs in its pools, or this long after its merge.
  evaluate_runs: 20
  evaluate_age: 72h
  learn_sessions: 1
  # Passed to packs/github (#379). Empty: no escalation chat.
  escalation_chat_pool: ""
  # Linear intake next to GitHub issues (#652): empty linear_team leaves
  # it off. The host sets these in livePackVars.
  linear_workspace: ""
  linear_team: ""
  linear_intake_labels: ""
  linear_human: ""
extends:
  - path: ../github
    vars:
      escalation_chat_pool: "{{.escalation_chat_pool}}"
      linear_workspace: "{{.linear_workspace}}"
      linear_team: "{{.linear_team}}"
      linear_intake_labels: "{{.linear_intake_labels}}"
      linear_human: "{{.linear_human}}"
      repo: elee1766/jobshop
      checkout: "{{.repo}}"
      agent: "{{.agent}}"
      dev_sessions: "{{.dev_sessions}}"
      refinery_sessions: "{{.refinery_sessions}}"
      refinery_model: "{{.refinery_model}}"
      refinery_effort: "{{.refinery_effort}}"
      dev_model: "{{.dev_model}}"
      dev_effort: "{{.dev_effort}}"
      dev_sonnet_sessions: "{{.dev_sonnet_sessions}}"
      dev_sonnet_model: "{{.dev_sonnet_model}}"
      dev_sonnet_effort: "{{.dev_sonnet_effort}}"
      stall_model: "{{.stall_model}}"
      stall_effort: "{{.stall_effort}}"
      human: elee1766
      # Contributors whose issue reports are picked up (#340).
      authors: zexoverz,hhenry88,forgotten-memory
      ci_workflow: ci
      check_cmd: go build ./... && go vet ./... && go test ./... && golangci-lint run ./... && nix fmt -- --check $(git ls-files '*.nix')
      docs_rule: >-
        behavior as built goes in a new file
        `docs/notes/<issue>-<slug>.md` (short, dated), a runbook check in a
        new file `docs/verify/<slug>.md`. Do not edit docs/plan.md (frozen
        2026-11-05); a design decision is one dated comment on the
        decision log issue #569. Never append a numbered section to
        docs/gasserver-verify.md.
      guide: >-
        Jobshop is Go, module github.com/elee1766/jobshop. Read AGENTS.md
        and docs/ first (docs/plan.md is the design archive; newer
        decisions are on issue #569).
      # Self-deploy promotes the newest green master commit every 10
      # minutes, so a merged change is live once jobshop reports it.
      deploy_check: >-
        `jobshop version --server` prints the running controller's
        `jobshop <version> (<commit>)`. Plain `jobshop version` is this
        session's binary, fixed when the session started, so it is stale
        after a self-deploy (#180). The commit must be the merge commit (or
        the needed SHA) or a
        descendant: `git fetch origin && git merge-base --is-ancestor
        <sha> <commit>`. Self-deploy rebuilds with the newest green master
        commit every 10 minutes.
# Memory and skills (#266): memory_dir holds memory/global.md,
# memory/repo/<owner>__<name>.md, memory/pool/<name>.md and
# skills/<name>/SKILL.md. It is local to the host, <root>/memory by
# default, outside any checkout (#592); "" turns it off.
# Curator (#273): a learn pool and a curate workflow, started by the
# curate trigger. The curator writes memory through `jobshop memory
# write` (memory-write grant) and files prompt fixes under packs/ as
# pr-work issues. The open run holds the trigger and its key dedups, so
# one curate run is open at a time.
pools:
  learn:
    agent: "{{.agent}}"
    repo: "{{.repo}}"
    ref: origin/master
    max_sessions: "{{.learn_sessions}}"
    idle_timeout: 10m
    turn_timeout: 2h
    prompt_file: prompts/learn.md
    admin: [memory-write]
workflows:
  curate:
    escalate_pool: plan
    escalate:
      chat_pool: "{{.escalation_chat_pool}}"
      prompt_file: ../github/prompts/escalation.md
      pool_prompt_file: ../github/prompts/escalation-pool.md
      hold_prompt_file: ../github/prompts/escalation-hold.md
    steps:
      - id: curate
        pool: learn
        retries: 1
        title: "Curate learnings"
        prompt_file: prompts/curate.md
  # Curator gate (#274): started when a merged curator edit is due.
  evaluate:
    escalate_pool: plan
    escalate:
      chat_pool: "{{.escalation_chat_pool}}"
      prompt_file: ../github/prompts/escalation.md
      pool_prompt_file: ../github/prompts/escalation-pool.md
      hold_prompt_file: ../github/prompts/escalation-hold.md
    steps:
      - id: evaluate
        pool: learn
        retries: 1
        title: "Evaluate memory edits"
        prompt_file: prompts/evaluate.md
  # Live check (#635): run a docs/verify runbook's readonly blocks in a
  # worktree of master and comment the results on the issue. Unmarked
  # blocks are listed as left for the operator. A failing block fails the
  # step. Started by the planner:
  # jobshop run start live-check --var runbook=docs/verify/<f>.md --var issue=<n>
  live-check:
    vars: [runbook, issue]
    issue: issue
    repo: elee1766/jobshop
    escalate_pool: plan
    steps:
      - id: check
        type: command
        pool: dev
        worktree: true
        timeout: 20m
        retries: 0
        run: |
          set +e
          out=$("${JOBSHOP_BIN:-jobshop}" runbook run "$JOBSHOP_VAR_RUNBOOK" 2>&1)
          rc=$?
          printf '%s\n' "$out"
          printf '%s\n' "$out" | gh issue comment "$JOBSHOP_VAR_ISSUE" --repo elee1766/jobshop --body-file - >&2
          [ "$rc" = 0 ] || exit 1
triggers:
  evaluate:
    when:
      edits: {runs: "{{.evaluate_runs}}", age: "{{.evaluate_age}}"}
    run:
      workflow: evaluate
      key: evaluate
  curate:
    when:
      learnings: {min: "{{.curate_min_learnings}}", every: "{{.curate_every}}", scope: "{{.curate_scope}}"}
    run:
      workflow: curate
      key: curate
prompt_rules:
  - name: selfdev-memory
    at: system
    # Ticket pools of every instance; the operator pack's rule covers chat.
    match: {chat: false}
    memory: {dir: "{{.memory_dir}}", cap: "{{.memory_cap}}"}
  # Jobshop-specific working notes (#592), moved from the old repo
  # memory/. Lasting guidance lives in prompts, memory stays local.
  - name: selfdev-guide
    at: system
    match: {chat: false, repos: [elee1766/jobshop]}
    file: prompts/guide.md
  # Live check (#635): targets stall on runbook-only items.
  - name: selfdev-live-check
    at: system
    match: {chat: false, pools: [plan], repos: [elee1766/jobshop]}
    file: prompts/live-check.md
