# Self-development pack: agents that build Jobshop itself.
# Vars: repo, agent, dev_sessions. See README.md.
pools:
  dev:
    agent: ${agent}
    repo: ${repo}
    ref: origin/master
    max_sessions: ${dev_sessions}
    idle_timeout: 10m
    turn_timeout: 2h
    prompt_file: prompts/dev.md
  plan:
    agent: ${agent}
    repo: ${repo}
    ref: origin/master
    max_sessions: 1
    idle_timeout: 10m
    turn_timeout: 2h
    prompt_file: prompts/plan.md
  refinery:
    agent: ${agent}
    repo: ${repo}
    ref: origin/master
    # One session serializes merges.
    max_sessions: 1
    idle_timeout: 10m
    turn_timeout: 2h
    prompt_file: prompts/refinery.md
triggers:
  replan:
    when:
      pool: dev
      ready_below: 1
    ticket:
      pool: plan
      title: Plan next step
      priority: 1
      labels: [plan]
    cooldown: 10m
  # One fix ticket per failing master SHA. The check runs on every tick
  # while no master-red ticket is open; gh needs GH_TOKEN in the controller
  # environment.
  master-red:
    when:
      check: >-
        gh run list --repo elee1766/jobshop --branch master --workflow ci
        --status completed --limit 1 --json conclusion,headSha
        --jq '.[] | select(.conclusion == "failure") | .headSha' | grep .
      check_timeout: 30s
    ticket:
      pool: dev
      title: "Fix red master CI"
      body: >-
        The latest completed master CI run failed. Find or file the fix
        issue (`gh run list --branch master`, `gh run view --log-failed`),
        then resolve it like any issue ticket.
      priority: 0
      labels: [master-red]
