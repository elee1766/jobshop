# Operator pack: a chat pool whose sessions talk to the operator and
# manage work (tickets, issues, messages, runs, reload). Vars: see
# README.md. The pool becomes `type: chat` once #122 lands; until then it
# starts no sessions on its own and is worked through `session new`.
defaults:
  operator_sessions: 0
  guide: >-
    Read the repo's README and contributor docs (AGENTS.md,
    CONTRIBUTING.md) first.
pools:
  operator:
    agent: ${agent}
    repo: ${checkout}
    ref: origin/master
    # 0: no automatic sessions; chat sessions are started by key.
    max_sessions: ${operator_sessions}
    idle_timeout: 12h
    turn_timeout: 1h
    prompt_file: prompts/operator.md
    # Lets the session socket run `jobshop reload` and `session list`.
    admin: [config-reload, session-list]
