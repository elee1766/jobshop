# Operator pack: a chat pool whose sessions talk to the operator and
# manage work across every pack instance on the host (tickets, issues,
# messages, runs, reload). Include it once in jobshop.yaml, without a
# prefix (#248). Vars: see README.md. Sessions are started per chat
# thread by the gateway (or `jobshop send` with a pool and key), one
# session per key.
defaults:
  operator_sessions: 0
  # Local memory (#592): relative to the root dir, so <root>/memory.
  memory_dir: memory
  memory_cap: 2200
# #248 renamed repo to jobshop_repo; hosts that still set repo keep
# working with a warning (#261). Remove after the next release.
renamed_vars:
  repo: jobshop_repo
pools:
  operator:
    type: chat
    attach: rw
    agent: "{{.agent}}"
    # Jobshop's checkout: prompt fixes land in its packs/.
    repo: "{{.checkout}}"
    ref: origin/master
    max_sessions: "{{.operator_sessions}}"
    idle_timeout: 12h
    turn_timeout: 1h
    prompt_file: prompts/operator.md
    # What the operator reads and does across instances: the merged
    # config and its instances, sessions, pools, triggers, attention, and
    # reload. Run list/show and tickets need no grant.
    admin: [config-reload, config-show, session-list, pool-list, pool-scale, session-cordon, session-config, trigger-list, attention, activity, ticket-release]
# Improvement sessions (#249): a session keyed improve:<slug> gets
# prompts/improve.md after the pool prompt.
prompt_rules:
  - name: operator-improve
    file: prompts/improve.md
    at: after
    match: {pools: [operator], keys: ["improve:*"]}
  # Memory and skills (#266), the same local directory as selfdev's
  # memory_dir (<root>/memory, #592). Set it to "" to turn memory off.
  - name: operator-memory
    at: system
    match: {pools: [operator]}
    memory: {dir: "{{.memory_dir}}", cap: "{{.memory_cap}}"}
# Operator sessions never push to master (#249). The prompt has them run
# `jobshop guard push --target <branch>` before a push; this hook denies
# master or main in any form (origin/master, HEAD:master,
# refs/heads/main) and a push with no target.
hooks:
  - on: action
    actions: [push]
    pools: [operator]
    command: |
      ev=$(cat)
      if ! printf '%s' "$ev" | grep -q '"target":"[^"]'; then
        echo '{"decision":"deny","reason":"name the branch: jobshop guard push --target <branch>"}'
      elif printf '%s' "$ev" | grep -Eq '"target":"([^"]*[:/])?(master|main)"'; then
        echo '{"decision":"deny","reason":"operator sessions never push to master; push a branch and open a PR"}'
      fi
