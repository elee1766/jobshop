version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - forbidigo
    - gocritic
    - misspell
    - revive
    - sloglint
    - unconvert
  settings:
    forbidigo:
      forbid:
        # Tests must not depend on wall time (#359): wait on events or
        # run a supervisor pass (pkg/orchestration/control Options.Pass) instead.
        - pattern: ^time\.Sleep$
          msg: no time.Sleep in tests; wait on an event or run a pass (#359)
      analyze-types: true
    sloglint:
      # Log through a passed logger with the ctx in scope, so the
      # logctx and OTel handlers see it (JOB-49).
      context: scope
      no-global: all
  exclusions:
    rules:
      # forbidigo is for tests only; production code may sleep.
      - path-except: _test\.go$
        linters: [forbidigo]

formatters:
  enable:
    - gofumpt
    - goimports
