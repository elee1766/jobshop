name: release

# release-please keeps one release PR open with the next 0.x version and
# CHANGELOG (#644). Ordinary merges only update it; merging the release
# PR tags the release, and the jobs below attach binaries and check Nix.
on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: talos-metal-gfx-public
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      # An App token, not GITHUB_TOKEN: a PR opened with GITHUB_TOKEN gets
      # no CI runs, so the required checks never report on the release PR.
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  desk-ui:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: talos-metal-gfx-public
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - uses: actions/upload-artifact@v4
        with:
          name: desk-ui
          path: pkg/transport/desk/dist
          if-no-files-found: error

  binaries:
    needs: [release-please, desk-ui]
    if: needs.release-please.outputs.created == 'true'
    runs-on: talos-metal-gfx-public
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: desk-ui
          path: pkg/transport/desk/dist
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          # The package builds without the UI, so check the bundle is there.
          test -f pkg/transport/desk/dist/index.html
          name="jobshop_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath \
            -ldflags "-s -w -X github.com/gfx-labs/jobshop/pkg/transport/cli.version=${VERSION} -X github.com/gfx-labs/jobshop/pkg/transport/cli.commit=${GITHUB_SHA::7}" \
            -o "dist/$name/jobshop" ./cmd/jobshop
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: jobshop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  upload:
    needs: [release-please, binaries]
    runs-on: talos-metal-gfx-public
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jobshop-*
          path: dist
          merge-multiple: true
      - name: checksums and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
          gh release upload "$TAG" *.tar.gz checksums.txt --repo "$GITHUB_REPOSITORY" --clobber

  nix:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: talos-metal-gfx-public
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.9/install
      - run: nix build .#jobshop --print-build-logs
      - name: version matches the release
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        # The Nix build adds +<commit> as build metadata (JOB-79): compare
        # the base version.
        run: ./result/bin/jobshop version | tee /dev/stderr | grep -q "jobshop ${VERSION}[+ ]"
