name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push cancels the running CI for the same PR; agents push often.
# Master runs are never cancelled: merges land every few minutes and
# the host deploy needs a green master commit (#830). The group still keeps
# one master run going and only the newest one queued.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  go:
    needs: ui
    # ubuntu-latest moved to 26.04, which has bwrap, so the sandbox tests
    # stopped skipping and crash there (#619). Pinned until they pass on it.
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-cache
      - nscloud-cache-tag-jobshop-go
      - nscloud-cache-size-20gb
      - nscloud-cache-allow-commit-from-master
    # Postgres and VictoriaLogs tests run here, not in their own jobs: their
    # time is mostly the Go build, which this job already pays once.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # The store conformance suite against Postgres (#493, JOB-35).
      JOBSHOP_TEST_POSTGRES: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      # Tests against a real VictoriaLogs (#530): a missing binary fails.
      JOBSHOP_REQUIRE_VICTORIALOGS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: desk-ui
          path: pkg/desk/dist
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # Namespace cache volume (runs-on labels): mounted, no restore or
      # upload step. Only master commits to it, so PRs share one warm cache.
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: go
      - name: install victoria-logs
        env:
          VL_VERSION: v1.53.0
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/vl"
          cd "$RUNNER_TEMP/vl"
          f=victoria-logs-linux-amd64-$VL_VERSION.tar.gz
          "$GITHUB_WORKSPACE/.github/scripts/fetch-release.sh" VictoriaMetrics/VictoriaLogs "$VL_VERSION" "$f" "victoria-logs-linux-amd64-${VL_VERSION}_checksums.txt"
          grep " $f\$" "victoria-logs-linux-amd64-${VL_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$f"
          bin=$(find "$PWD" -type f -name 'victoria-logs*' ! -name '*.tar.gz' ! -name '*.txt' | head -1)
          echo "VICTORIALOGS_BIN=$bin" >> "$GITHUB_ENV"
      - run: go build ./...
      - run: go vet -tags victorialogs ./...
      # checkptr is off for modernc's machine-translated C only: its pointer
      # arithmetic is ~a third of race-test CPU and is not our code. The
      # race detector still covers it (#433).
      - name: go test
        id: test
        run: |
          go test -json -race -tags victorialogs -gcflags='modernc.org/...=-d=checkptr=0' ./... > test.json 2>&1 || rc=$?
          # Readable log from the JSON stream.
          go run ./pkg/flaky/cmd/ci-flaky -print -in test.json
          # These packages skip without their service. Here a skip means the
          # service was missing, so fail instead of passing silently.
          skipped=$(jq -rR 'fromjson? | select(.Action == "skip" and .Test != null and (.Package | test("store/postgres|store/storemigrate|journalvl"))) | "\(.Package) \(.Test)"' test.json)
          if [ -n "$skipped" ]; then echo "skipped:"; echo "$skipped"; exit 1; fi
          exit "${rc:-0}"
      # On failure, rerun each failed test 20 times: flaky or broken (#510).
      # The job still fails; failed-tests.json is for the planner.
      - name: rerun failed tests
        if: failure() && steps.test.outcome == 'failure'
        run: go run ./pkg/flaky/cmd/ci-flaky -in test.json -out failed-tests.json -summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure() && steps.test.outcome == 'failure'
        with:
          name: failed-tests
          path: failed-tests.json
          if-no-files-found: ignore
      # Not golangci-lint-action: it downloads from the release host that
      # returned 504 for hours on 2026-11-08 (#1040).
      - name: golangci-lint
        env:
          # Keep equal to the golangci-lint gasserver.nix puts on agents' PATH.
          GL_VERSION: v2.15.0
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gl"
          cd "$RUNNER_TEMP/gl"
          n=golangci-lint-${GL_VERSION#v}
          "$GITHUB_WORKSPACE/.github/scripts/fetch-release.sh" golangci/golangci-lint "$GL_VERSION" "$n-linux-amd64.tar.gz" "$n-checksums.txt"
          grep " $n-linux-amd64.tar.gz\$" "$n-checksums.txt" | sha256sum -c -
          tar xzf "$n-linux-amd64.tar.gz"
          cd "$GITHUB_WORKSPACE"
          # Lint the tagged test files too, or they rot unseen.
          "$RUNNER_TEMP/gl/$n-linux-amd64/golangci-lint" run --build-tags=victorialogs
      - name: shellcheck deploy scripts
        run: shellcheck -s sh deploy/*.sh .github/scripts/*.sh

  nix:
    # 2x4 OOMs evaluating the module check; 4x8 costs the same units as 2x8.
    runs-on:
      - nscloud-ubuntu-24.04-amd64-4x8-with-cache
      - nscloud-cache-tag-jobshop-nix
      - nscloud-cache-size-40gb
      - nscloud-cache-allow-commit-from-master
    steps:
      - uses: actions/checkout@v5
      # The Nix store lives on the cache volume, replacing hestia's
      # Actions-cache binary cache. Must come before Nix is installed.
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: /nix
      - uses: cachix/install-nix-action@v31
        with:
          # go2nix's plugin needs Nix 2.34, the Nix it is built against.
          install_url: https://releases.nixos.org/nix/nix-2.34.9/install
      # Nix files stay formatted with the flake's formatter (#583).
      - name: nix fmt check
        run: nix fmt -- --check $(git ls-files '*.nix')
      # Check generated assets and the vendorHash with the fallback builder too.
      - run: nix build .#jobshop --out-link result-fallback --print-build-logs
      - run: ./result-fallback/bin/jobshop version
      # Loads go2nix's plugin so jobshop builds one derivation per Go package,
      # each cached on its own in the store volume.
      - name: go2nix plugin
        run: echo "plugin-files = $(nix build --no-link --print-out-paths .#go2nix-plugin)/lib/nix/plugins/libgo2nix_plugin.so" | sudo tee -a /etc/nix/nix.conf
      - run: nix build .#jobshop --print-build-logs
      - run: ./result/bin/jobshop version
      # NixOS module evaluation checks (nix/module-test.nix).
      - run: nix build .#checks.x86_64-linux.module --print-build-logs

  # Build once for the Go checks. Nix builds its own cached frontend derivation.
  ui:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-cache
      - nscloud-cache-tag-jobshop-npm
      - nscloud-cache-size-20gb
      - nscloud-cache-allow-commit-from-master
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test ../packages/jobshop-client/index.test.js kit/links.test.js kit/titles.test.js
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: desk-ui
          path: pkg/desk/dist
          if-no-files-found: error
