name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: sqlc generated code is current
        run: go tool sqlc diff
        working-directory: pkg/store/sqlite
        if: hashFiles('pkg/store/sqlite/sqlc.yaml') != ''
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix build .#jobshop --print-build-logs
      - run: ./result/bin/jobshop version
