name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # setup-go's cache keys on go.sum only, with no fallback, so every
          # dependency change rebuilt from scratch. The cache below falls back.
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: sqlc generated code is current
        run: go tool sqlc diff
        working-directory: pkg/store/sqlite
        if: hashFiles('pkg/store/sqlite/sqlc.yaml') != ''
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # Keeps the Go toolchain and the vendored-modules derivation between runs.
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/**', 'go.sum') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - run: nix build .#jobshop --print-build-logs
      - run: ./result/bin/jobshop version
