name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push cancels the running CI for the same PR; agents push often.
# Master runs are never cancelled: merges land every few minutes and
# the host deploy needs a green master commit (#830). The group still keeps
# one master run going and only the newest one queued.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  go:
    needs: ui
    # Was pinned to Ubuntu 24.04 because the sandbox tests crash where bwrap
    # exists (#619). Watch for that on the talos-metal runner image.
    runs-on: talos-metal-gfx-public
    # Postgres and VictoriaLogs tests run here, not in their own jobs: their
    # time is mostly the Go build, which this job already pays once.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # The store conformance suite against Postgres (#493, JOB-35).
      JOBSHOP_TEST_POSTGRES: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      # Tests against a real VictoriaLogs (#530): a missing binary fails.
      JOBSHOP_REQUIRE_VICTORIALOGS: "1"
      # Tests that read the built Desk UI skip without it; here that fails.
      JOBSHOP_REQUIRE_DESK_UI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: desk-ui
          path: pkg/transport/desk/dist
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # setup-go's cache keys on go.sum only, with no fallback, so every
          # dependency change rebuilt from scratch. The cache below falls back.
          cache: false
      # Restore here, save only on master after a trim (below), so PRs share
      # master's cache and it does not grow with every build.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - name: install victoria-logs
        env:
          VL_VERSION: v1.53.0
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/vl"
          cd "$RUNNER_TEMP/vl"
          f=victoria-logs-linux-amd64-$VL_VERSION.tar.gz
          "$GITHUB_WORKSPACE/.github/scripts/fetch-release.sh" VictoriaMetrics/VictoriaLogs "$VL_VERSION" "$f" "victoria-logs-linux-amd64-${VL_VERSION}_checksums.txt"
          grep " $f\$" "victoria-logs-linux-amd64-${VL_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$f"
          bin=$(find "$PWD" -type f -name 'victoria-logs*' ! -name '*.tar.gz' ! -name '*.txt' | head -1)
          echo "VICTORIALOGS_BIN=$bin" >> "$GITHUB_ENV"
      - run: go build ./...
      - run: go vet -tags victorialogs ./...
      # Import-graph boundaries (JOB-165): the ownership table and layer rules
      # in pkg/tooling/archcheck. The same check runs inside go test below as
      # TestRepository. This step is first so a boundary break reads as one.
      - run: go run ./pkg/tooling/archcheck/cmd/archcheck
      # checkptr is off for modernc's machine-translated C only: its pointer
      # arithmetic is ~a third of race-test CPU and is not our code. The
      # race detector still covers it (#433). The translated C itself
      # (modernc.org/sqlite/lib) is not race-instrumented either: it was
      # ~40% of pkg/orchestration/control CPU on the 2-vCPU runner and keeps its state
      # behind its own mutexes. The Go wrapper stays instrumented (JOB-117).
      - name: go test
        id: test
        env:
          # The race runtime sleeps 1s before every race-built process
          # exits: each test binary and each child a test runs (JOB-117).
          # Reports are written when a race is found, not at exit.
          GORACE: atexit_sleep_ms=0
        run: |
          go test -json -race -tags victorialogs -gcflags='modernc.org/...=-d=checkptr=0' -gcflags='modernc.org/sqlite/lib=-race=false' ./... > test.json 2>&1 || rc=$?
          # Readable log from the JSON stream.
          go run ./pkg/tooling/flaky/cmd/ci-flaky -print -in test.json
          # These packages skip without their service. Here a skip means the
          # service was missing, so fail instead of passing silently.
          skipped=$(jq -rR 'fromjson? | select(.Action == "skip" and .Test != null and (.Package | test("store/postgres|store/storemigrate|journalvl"))) | "\(.Package) \(.Test)"' test.json)
          if [ -n "$skipped" ]; then echo "skipped:"; echo "$skipped"; exit 1; fi
          exit "${rc:-0}"
      # On failure, rerun each failed test 20 times: flaky or broken (#510).
      # The job still fails; failed-tests.json is for the planner.
      - name: rerun failed tests
        if: failure() && steps.test.outcome == 'failure'
        run: go run ./pkg/tooling/flaky/cmd/ci-flaky -in test.json -out failed-tests.json -summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure() && steps.test.outcome == 'failure'
        with:
          name: failed-tests
          path: failed-tests.json
          if-no-files-found: ignore
      # Not golangci-lint-action: it downloads from the release host that
      # returned 504 for hours on 2026-11-08 (#1040).
      - name: golangci-lint
        env:
          # Keep equal to the golangci-lint gasserver.nix puts on agents' PATH.
          GL_VERSION: v2.15.0
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gl"
          cd "$RUNNER_TEMP/gl"
          n=golangci-lint-${GL_VERSION#v}
          "$GITHUB_WORKSPACE/.github/scripts/fetch-release.sh" golangci/golangci-lint "$GL_VERSION" "$n-linux-amd64.tar.gz" "$n-checksums.txt"
          grep " $n-linux-amd64.tar.gz\$" "$n-checksums.txt" | sha256sum -c -
          tar xzf "$n-linux-amd64.tar.gz"
          cd "$GITHUB_WORKSPACE"
          # Lint the tagged test files too, or they rot unseen.
          "$RUNNER_TEMP/gl/$n-linux-amd64/golangci-lint" run --build-tags=victorialogs
      - name: shellcheck deploy scripts
        run: shellcheck -s sh deploy/*.sh .github/scripts/*.sh
      # Go bumps an entry's mtime when it is used and was last touched over
      # an hour ago, so anything older than 90 minutes was not used by this
      # run. Dropping it keeps the cache from growing with every build.
      - name: trim go build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          du -sh ~/.cache/go-build
          find ~/.cache/go-build -type f -mmin +90 -delete
          du -sh ~/.cache/go-build
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  nix:
    # The module check ran out of memory on a 4GB runner. This one has 16GB.
    runs-on: talos-metal-gfx-public
    permissions:
      contents: read
      actions: read # hestia: detect evicted cache entries upfront
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          # go2nix's plugin needs Nix 2.34, the Nix it is built against.
          install_url: https://releases.nixos.org/nix/nix-2.34.9/install
      # Binary cache in the Actions cache: uploads each path this job builds
      # and substitutes them next run. Paths cache.nixos.org already serves
      # are not stored. PRs only read it, like the Go cache.
      - uses: Mic92/hestia@v3
        with:
          upstream-cache-filter: true
          read-only: ${{ github.event_name == 'pull_request' }}
      # Nix files stay formatted with the flake's formatter (#583).
      - name: nix fmt check
        run: nix fmt -- --check $(git ls-files '*.nix')
      # Check generated assets and the vendorHash with the fallback builder too.
      - run: nix build .#jobshop --out-link result-fallback --print-build-logs
      - run: ./result-fallback/bin/jobshop version
      # Loads go2nix's plugin so jobshop builds one derivation per Go package,
      # each cached on its own by hestia.
      - name: go2nix plugin
        run: echo "plugin-files = $(nix build --no-link --print-out-paths .#go2nix-plugin)/lib/nix/plugins/libgo2nix_plugin.so" | sudo tee -a /etc/nix/nix.conf
      - run: nix build .#jobshop --print-build-logs
      - run: ./result/bin/jobshop version
      # NixOS module evaluation checks (nix/module-test.nix).
      - run: nix build .#checks.x86_64-linux.module --print-build-logs

  # Desk browser checks on an isolated controller (JOB-162): ticket menu,
  # message headers and iframe tabs. The script makes its own root, ports and
  # fixture, so nothing here touches a real instance.
  e2e:
    needs: ui
    runs-on: talos-metal-gfx-public
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: desk-ui
          path: pkg/transport/desk/dist
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Restore only: the go job saves this cache on master.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      # The test binary is the ACP test agent that chat sessions run.
      - run: |
          go build -o "$RUNNER_TEMP/jobshop" ./cmd/jobshop
          go test -c -o "$RUNNER_TEMP/control.test" ./pkg/orchestration/control
      - run: npm --prefix ui ci
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: desk e2e
        working-directory: ui
        env:
          JOBSHOP_BIN: ${{ runner.temp }}/jobshop
          FAKE_AGENT_BIN: ${{ runner.temp }}/control.test
        run: node e2e/run-isolated.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: ui/test-results
          if-no-files-found: ignore

  # Build once for the Go checks. Nix builds its own cached frontend derivation.
  ui:
    runs-on: talos-metal-gfx-public
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: desk-ui
          path: pkg/transport/desk/dist
          if-no-files-found: error
