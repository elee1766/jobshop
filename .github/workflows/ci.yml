name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    # ubuntu-latest moved to 26.04, which has bwrap, so the sandbox tests
    # stopped skipping and crash there (#619). Pinned until they pass on it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # setup-go's cache keys on go.sum only, with no fallback, so every
          # dependency change rebuilt from scratch. The cache below falls back.
          cache: false
      # Restore here, save only on master after a trim (below). Saving every
      # run with no trim grew the cache to 2GB, about 25s to restore.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - run: go build ./...
      - run: go vet ./...
      # checkptr is off for modernc's machine-translated C only: its pointer
      # arithmetic is ~a third of race-test CPU and is not our code. The
      # race detector still covers it (#433).
      - name: go test
        id: test
        run: |
          go test -json -race -gcflags='modernc.org/...=-d=checkptr=0' ./... > test.json 2>&1 || rc=$?
          # Readable log from the JSON stream.
          go run ./pkg/flaky/cmd/ci-flaky -print -in test.json
          exit "${rc:-0}"
      # On failure, rerun each failed test 20 times: flaky or broken (#510).
      # The job still fails; failed-tests.json is for the planner.
      - name: rerun failed tests
        if: failure() && steps.test.outcome == 'failure'
        run: go run ./pkg/flaky/cmd/ci-flaky -in test.json -out failed-tests.json -summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure() && steps.test.outcome == 'failure'
        with:
          name: failed-tests
          path: failed-tests.json
          if-no-files-found: ignore
      - uses: golangci/golangci-lint-action@v8
        with:
          # Keep equal to the golangci-lint gasserver.nix puts on agents' PATH.
          version: v2.15.0
          # Lint the tagged test files too, or they rot unseen.
          args: --build-tags=victorialogs
      - name: shellcheck deploy scripts
        run: shellcheck -s sh deploy/*.sh
      # Go bumps an entry's mtime when it is used and was last touched over
      # an hour ago, so anything older than 90 minutes was not used by this
      # run. Dropping it keeps the cache from growing with every build.
      - name: trim go build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          du -sh ~/.cache/go-build
          find ~/.cache/go-build -type f -mmin +90 -delete
          du -sh ~/.cache/go-build
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  nix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # hestia: detect evicted cache entries upfront
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          # go2nix's plugin needs Nix 2.34, the Nix it is built against.
          install_url: https://releases.nixos.org/nix/nix-2.34.9/install
      # Binary cache in the GitHub Actions cache: uploads each path this job
      # builds (the vendored-modules derivation, jobshop) and substitutes them
      # next run. Paths cache.nixos.org already serves are not stored.
      # PRs only read it, like the Go cache: master pushes populate it, so
      # each PR does not store its own slightly different paths.
      - uses: Mic92/hestia@v3
        with:
          upstream-cache-filter: true
          read-only: ${{ github.event_name == 'pull_request' }}
      # Nix files stay formatted with the flake's formatter (#583).
      - name: nix fmt check
        run: nix fmt -- --check $(git ls-files '*.nix')
      # The fallback builder (hosts without the plugin) pins a vendorHash.
      # Building only its vendored modules checks the pin; it is cached
      # until go.sum changes.
      - run: nix build .#jobshop.goModules --print-build-logs
      # Loads go2nix's plugin so jobshop builds one derivation per Go package,
      # each cached on its own by hestia.
      - name: go2nix plugin
        run: echo "plugin-files = $(nix build --no-link --print-out-paths .#go2nix-plugin)/lib/nix/plugins/libgo2nix_plugin.so" | sudo tee -a /etc/nix/nix.conf
      - run: nix build .#jobshop --print-build-logs
      - run: ./result/bin/jobshop version
      # NixOS module evaluation checks (nix/module-test.nix).
      - run: nix build .#checks.x86_64-linux.module --print-build-logs

  # Desk's built UI is committed in pkg/desk/dist and embedded (#208):
  # svelte-check must pass and the committed build must match ui/src.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: pkg/desk/dist is current
        run: git diff --exit-code -- ../pkg/desk/dist && test -z "$(git status --porcelain -- ../pkg/desk/dist)"

  # Tests against a real VictoriaLogs (#530), built with -tags victorialogs.
  # The go job builds without the tag, so it does not see them. A missing
  # binary or any skipped test fails the job.
  victorialogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-vl-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-vl-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-vl-${{ runner.os }}-
      - name: install victoria-logs
        env:
          VL_VERSION: v1.53.0
        run: |
          mkdir -p "$RUNNER_TEMP/vl"
          cd "$RUNNER_TEMP/vl"
          f=victoria-logs-linux-amd64-$VL_VERSION.tar.gz
          curl -fsSLO "https://github.com/VictoriaMetrics/VictoriaLogs/releases/download/$VL_VERSION/$f"
          curl -fsSLO "https://github.com/VictoriaMetrics/VictoriaLogs/releases/download/$VL_VERSION/victoria-logs-linux-amd64-${VL_VERSION}_checksums.txt"
          grep " $f\$" "victoria-logs-linux-amd64-${VL_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$f"
          bin=$(find "$PWD" -type f -name 'victoria-logs*' ! -name '*.tar.gz' ! -name '*.txt' | head -1)
          echo "VICTORIALOGS_BIN=$bin" >> "$GITHUB_ENV"
          echo "JOBSHOP_REQUIRE_VICTORIALOGS=1" >> "$GITHUB_ENV"
      - run: go vet -tags victorialogs ./...
      # Only the tagged package (JOB-47): it drives a controller through its
      # RPC API, so the rest of pkg/control stays in the go job.
      - name: go test
        shell: bash # pipefail, so a test failure is not hidden by tee
        run: |
          go test -race -v -tags victorialogs ./pkg/control/journalvl/ | tee /tmp/vl-test.log
          grep -q -- '--- PASS' /tmp/vl-test.log || { echo "no victorialogs tests ran"; exit 1; }
          if grep -- '--- SKIP' /tmp/vl-test.log; then echo "tests skipped"; exit 1; fi

  # The store conformance suite against Postgres (#493). The go job runs
  # it against SQLite; pkg/store/postgres's tests skip without the DSN.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      JOBSHOP_TEST_POSTGRES: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-pg-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-pg-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-pg-${{ runner.os }}-
      # JOB-35: every case must run on Postgres. A missing DSN or any
      # skipped test fails the job instead of passing silently.
      - name: storetest on postgres
        shell: bash # explicit bash sets pipefail, so a test failure is not hidden by tee
        run: |
          test -n "$JOBSHOP_TEST_POSTGRES" || { echo "JOBSHOP_TEST_POSTGRES is not set"; exit 1; }
          go test -race -v ./pkg/store/postgres/ ./pkg/store/storemigrate/ | tee /tmp/pg-test.log
          if grep -- '--- SKIP' /tmp/pg-test.log; then echo "tests skipped on postgres"; exit 1; fi
